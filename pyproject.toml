[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-analyzer"
version = "0.1.0"
description = "A developer tool for analyzing Python codebases: structure, dependencies, cycles, and architectural violations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "tomli; python_version < '3.11'",
    "rich>=13.0"
]

[project.scripts]
codebase-analyzer = "codebase_analyzer.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
